services:
  - type: web
    name: brokerbyte-backend
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: gunicorn -w 4 -b 0.0.0.0:$PORT app:app
    healthCheckPath: /api/health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: https://your-vercel-frontend.vercel.app
      - key: DEBUG
        value: "false"
      - key: PORT
        value: "5000"
      - key: PYTHON_VERSION
        value: "3.11"
